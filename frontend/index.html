<!DOCTYPE html>
<html>
<head>
    <title>Exam Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <div style="font-size:60px; margin-bottom:15px;">🎓</div>
        <h2>Online Exam Login</h2>
        <p class="subtitle">Enter your credentials to continue</p>

        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="msg"></p>
    </div>
</div>

<script>

// 🔒 CHECK USER STATUS AFTER LOGIN
async function checkUserStatus(username) {
    const res = await fetch(`http://localhost:5000/api/myresult/${username}`);
    const data = await res.json();

    if (data && data.status) {
        // already attempted → go to dashboard
        window.location.href = "dashboard.html";
    } else {
        // new user → go to exam
        window.location.href = "softskills.html";
    }
}


// 🔑 LOGIN FUNCTION
async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost:5000/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
        // ✅ store username
        localStorage.setItem("username", username);

        // 🔥 redirect based on status
        checkUserStatus(username);

    } else {
        document.getElementById("msg").innerText = data.message;
    }
}

</script>

</body>
</html>
